[project]
name = "btnhom"
version = "0.1.0"
description = "Bài tập nhóm "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.7.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[tool.setuptools]
package-dir = { "" = "." }
packages = ["src"]

[tool.pyrefly]
disable-search-path-heuristics = true
search-path = ["."]
use-ignore-files = true
project-excludes = [
    "**/.venv/**",
    "**/data/**",
    "**/scratch/**",
    "**/__pycache__/**",
]
